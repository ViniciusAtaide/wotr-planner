[package]
name = "mcp"
version.workspace = true
edition.workspace = true

# The MCP server (`wotr-mcp`): lets an agent search the game data and, in later slices, build with the rules
# engine. stdio only; native only (never in the wasm build).
[[bin]]
name = "wotr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
rules.workspace = true
# The tools' JSON Schemas; rmcp's own schemars major.
schemars = "1.2.3"
seeds.workspace = true
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The tests talk to the server as an MCP client over an in-memory pipe.
rmcp = { workspace = true, features = ["client"] }
