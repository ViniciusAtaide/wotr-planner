[package]
name = "frontend"
version.workspace = true
edition.workspace = true

# The wasm entry point (cargo-leptos `lib-package`). `hydrate` only; never `ssr`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ui = { workspace = true, features = ["hydrate"] }
leptos = { workspace = true, features = ["hydrate"] }
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true

[features]
# Benchmarks only: `cargo leptos build --release --lib-features timings`.
timings = ["ui/timings"]

[lints.cargo]
# `console_error_panic_hook` is only called in dev builds (`#[cfg(debug_assertions)]`), so release builds see it
# as unused.
unused_dependencies = "allow"
