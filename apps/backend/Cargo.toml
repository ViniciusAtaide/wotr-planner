[package]
name = "server"
version.workspace = true
edition.workspace = true

# The Axum entry point (cargo-leptos `bin-package`).
[dependencies]
ui = { workspace = true, features = ["ssr"] }
seeds.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum.workspace = true
tokio.workspace = true
dotenvy.workspace = true
rules.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
# Compresses every response (brotli or gzip, as the browser takes it).
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
