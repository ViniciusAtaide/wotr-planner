[package]
name = "server"
version.workspace = true
edition.workspace = true

# The Axum entry point (cargo-leptos `bin-package`).
[dependencies]
ui = { workspace = true, features = ["ssr"] }
seeds.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum.workspace = true
tokio.workspace = true
dotenvy.workspace = true
# The MCP server, served over HTTP beside the site (`WOTR_MCP_PORT`).
mcp.workspace = true
rules.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
# Serves `site-pkg-dir` (`fs`, which leptos_axum already enables). Nothing is compressed (ticket 185).
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
