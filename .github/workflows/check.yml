# Runs the full set of checks (CLAUDE.md "Checks": the guarded files, fmt, css-classes, clippy on both targets, the
# workspace tests, the rules wasm build and the data check) on every push to main and every pull request, and by hand.
# The cargo-leptos builds are left to the Pages workflow, which builds the site.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a check still running for an older one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the guarded-files step diffs against the merge base with the default branch.
          fetch-depth: 0

      # Ticket 322: an expected value of the gold Builds or a held user fact changes only with the user's `User
      # approved:` line in the ticket's file. Against the merge base with the default branch: a pull request's
      # commits. A push to `main` checks nothing: there the merge base is HEAD itself, and the diff is empty.
      - name: guarded-files
        run: |
          scripts/guarded-files-test.sh
          scripts/guarded-files.sh "$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"

      # rustup is on the runner: this installs the nightly pinned in rust-toolchain.toml with its components.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Caches ~/.cargo and target/ between runs; its own key, so it doesn't evict the Pages build's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: fmt
        run: cargo fmt --all --check
      - name: css-classes
        run: scripts/css-classes.sh
      - name: test-modules
        run: scripts/test-modules.sh
      - name: clippy
        run: cargo clippy -q --workspace --all-targets -- -D warnings
      - name: clippy, frontend wasm
        run: cargo clippy -q -p frontend --target wasm32-unknown-unknown -- -D warnings
      - name: test
        run: cargo test -q --workspace
      - name: rules wasm build
        run: cargo build -q -p rules --target wasm32-unknown-unknown
      - name: check-data
        run: cargo run -q -p seeds --bin check-data
