[package]
name = "ui"
version.workspace = true
edition.workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
rules.workspace = true
serde_json = "1.0.154"
# Browser APIs the sheet uses on the client: the URL fragment (History), timings (Performance), the game data's
# preload link and its download (Document, Element, Response), and the build sheet's copy (Navigator, Clipboard)
# and download (Blob, BlobPropertyBag, Url, HtmlAnchorElement, HtmlElement).
web-sys = { version = "0.3.107", features = ["Blob", "BlobPropertyBag", "Clipboard", "Document", "Element", "History", "HtmlAnchorElement", "HtmlElement", "Location", "Navigator", "Performance", "Response", "Url", "Window"] }
js-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"

[features]
default = []
hydrate = ["leptos/hydrate"]
# Server-side rendering, for the backend: turns on the `ssr` feature of leptos and leptos_meta (and, through them, of
# server_fn) and adds one crate, `inventory` (`cargo tree -p ui -e features --features ssr`). Never add it to
# `default`: the frontend's wasm build takes `hydrate`, and server rendering belongs to the backend alone.
ssr = ["leptos/ssr", "leptos_meta/ssr"]
# Records engine-call timings in a release build too, for benchmarks (see `src/timings.rs`). Dev builds always do.
timings = []
