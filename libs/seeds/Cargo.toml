[package]
name = "seeds"
version.workspace = true
edition.workspace = true

# Native only: reads the game data files (`ron`). Never reachable from the wasm build (used by `server`, `mcp` and
# `corpus`).
[dependencies]
ron.workspace = true
rules.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# The browser-JSON round trip of the real data, as the backend writes it and the web app reads it.
serde_json = "1.0.154"
# The real-data tests use the rules crate's test helpers.
rules = { workspace = true, features = ["testing"] }
