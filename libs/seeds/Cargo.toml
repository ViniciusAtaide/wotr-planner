[package]
name = "seeds"
version.workspace = true
edition.workspace = true

# Native only: sqlx models, queries and migrations. Never reachable from the wasm build
# (used only by `server` and `proof`).
[dependencies]
dotenvy.workspace = true
ron.workspace = true
rules.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
# The real-data tests use the rules crate's test helpers.
rules = { workspace = true, features = ["testing"] }
