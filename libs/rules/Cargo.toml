[package]
name = "rules"
version.workspace = true
edition.workspace = true

# Pure game rules shared by the browser (wasm) and the server. Keep it serde-only:
# no Leptos, no sqlx, no tokio.
[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde.workspace = true

[features]
# Helpers only tests use (`Engine::state_before`, `LinkKeys::of_build`, `rules::agreement`); never turned on by the
# apps.
testing = []
# `rules::test_world`: a small invented game world and helpers for writing Builds against it, for tests outside this
# crate too (`apps/mcp`). Only test targets turn it on, through dev-dependencies; never turned on by the apps.
test-world = []
# The behaviour proof's way past `GameData::check` (`From<GameData> for CheckedGameData`), so it can record older game
# data that fails a check rule added with its data fix. Only `tools/proof` turns it on; never the apps or the tests.
unchecked = []

[dev-dependencies]
proptest = "1.12.0"
# The crate's own tests turn on its test helpers and the test world.
rules = { path = ".", features = ["testing", "test-world"] }
