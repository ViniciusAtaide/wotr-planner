[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
rules.workspace = true
serde.workspace = true
# Browser APIs the sheet uses on the client: the URL fragment (History), timings (Performance).
web-sys = { version = "0.3.107", features = ["History", "Location", "Performance", "Window"] }
js-sys = "0.3.107"

[features]
default = []
hydrate = ["leptos/hydrate"]
# Never add `ssr` to `default`: it pulls sqlx/tokio into the wasm build.
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
